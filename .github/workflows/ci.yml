name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

env:
  UV_FROZEN: "1"
  MUJOCO_GL: disable

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run lint
        run: uvx ruff@0.15.0 check --diff src/
      - name: Run format
        run: uvx ruff@0.15.0 format --diff src/

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supermimic
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: supermimic
      - name: Checkout mjlab
        uses: actions/checkout@v4
        with:
          repository: mujocolab/mjlab
          ref: 08090e8a77228e733373f3b5c54f8b5a68d19d9d
          path: mjlab_research
      - name: Apply public mjlab compatibility patch
        run: git -C ../mjlab_research apply ../supermimic/patches/mjlab-public.patch
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest || [ $? -eq 5 ]
